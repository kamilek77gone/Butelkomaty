
name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Briefcase
        run: python -m pip install --upgrade pip briefcase

      - name: Create Android project
        run: briefcase create android --no-input

      - name: Build Android project
        run: briefcase build android --no-input

      - name: Package Android app
        run: briefcase package android --no-input

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: butelkomaty-android-apk
          path: |
            build/**/android/gradle/app/build/outputs/apk/**/*.apk
            build/**/android/gradle/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14
