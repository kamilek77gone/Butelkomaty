name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libgirepository1.0-dev zip unzip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install briefcase

      - name: Create Android App with Briefcase
        run: |
          briefcase create android --no-input

      - name: Build Android App Package
        run: |
          briefcase build android --no-input

      - name: Upload APK / Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-app-build
          path: |
            build/**/android/gradle/app/build/outputs/apk/**/*.apk
            build/**/android/gradle/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
